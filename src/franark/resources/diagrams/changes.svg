<tspan x="995" dy="0">request changes</tspan>
</text>
<rect x="1066" y="736" width="116.0" height="26" rx="3" fill="white"/>
<text x="1070" y="755" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#111111">
<tspan x="1070" dy="0">correction</tspan>
</text>
<text x="80" y="1000" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#354352">
<tspan x="80" dy="0">A correction resets acknowledgement. A newer approved correction blocks older exports.</tspan>
<tspan x="80" dy="23.75">Definitions already have version keys; an administrative form-design and publishing workflow is not implemented.</tspan>
</text>
<line x1="42" y1="1062" x2="1398" y2="1062" stroke="#d2d9e0"/>
<text x="42" y="1092" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#111111">
<tspan x="42" dy="0">Blue: pilot implementation / Green: existing process / Dashed: unverified connection or proposed option</tspan>
</text>
<text x="42" y="1119" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" fill="#4a5664">
<tspan x="42" dy="0">SFC tenant target / Synthetic pilot / External connections remain unverified</tspan>
</text>
</svg>
