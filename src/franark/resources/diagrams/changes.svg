<tspan x="42" dy="0">09 / FRANARK / STATE MODEL</tspan>
</text>
<text x="42" y="88" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="bold" fill="#111111">
<tspan x="42" dy="0">Revision and change control</tspan>
</text>
<text x="42" y="123" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#111111">
<tspan x="42" dy="0">Changing a submitted assessment creates another record, rather than rewriting its history.</tspan>
</text>
