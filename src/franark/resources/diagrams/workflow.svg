</text>
<text x="80" y="1010" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#354352">
<tspan x="80" dy="0">Approval is blocked by validation errors. AI may suggest findings; it cannot approve.</tspan>
<tspan x="80" dy="23.75">Changes create a linked draft with a new acknowledgement. The submitted revision remains fixed.</tspan>
</text>
<line x1="42" y1="1062" x2="1398" y2="1062" stroke="#d2d9e0"/>
