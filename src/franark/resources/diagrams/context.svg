</text>
<text x="80" y="915" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#354352">
<tspan x="80" dy="0">A client signs within the employee session; this model does not introduce client accounts.</tspan>
<tspan x="80" dy="23.75">The service hierarchy is separate from user roles and application permissions.</tspan>
</text>
<line x1="42" y1="982" x2="1398" y2="982" stroke="#d2d9e0"/>
<text x="42" y="1012" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#111111">
<tspan x="42" dy="0">Solid: actor or implemented surface / Dashed: proposed surface</tspan>
</text>
<text x="42" y="1039" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" fill="#4a5664">
<tspan x="42" dy="0">SFC tenant target / Synthetic pilot / External connections remain unverified</tspan>
</text>
