<text x="778" y="582" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#111111">
<tspan x="778" dy="0">Capture channels</tspan>
</text>
<rect x="80" y="280" width="245" height="70" rx="8" fill="#f2f4f7" stroke="#687787" stroke-width="1.8"/>
<text x="202.5" y="323.05" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" fill="#111111">
<tspan x="202.5" dy="0">Computer</tspan>
</text>
<rect x="360" y="280" width="245" height="70" rx="8" fill="#f2f4f7" stroke="#687787" stroke-width="1.8"/>
<text x="482.5" y="323.05" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" fill="#111111">
<tspan x="482.5" dy="0">Tablet</tspan>
</text>
<rect x="80" y="400" width="245" height="70" rx="8" fill="#f2f4f7" stroke="#687787" stroke-width="1.8"/>
<text x="202.5" y="443.05" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" fill="#111111">
<tspan x="202.5" dy="0">Phone</tspan>
</text>
<rect x="800" y="280" width="245" height="70" rx="8" fill="#e7f1ff" stroke="#326cb0" stroke-width="1.8"/>
<text x="922.5" y="323.05" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" fill="#111111">
<tspan x="922.5" dy="0">Keyboard</tspan>
</text>
<rect x="1080" y="280" width="245" height="70" rx="8" fill="#e7f1ff" stroke="#326cb0" stroke-width="1.8"/>
<text x="1202.5" y="323.05" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" fill="#111111">
<tspan x="1202.5" dy="0">Touch</tspan>
</text>
<rect x="800" y="400" width="245" height="70" rx="8" fill="#e7f1ff" stroke="#326cb0" stroke-width="1.8"/>
<text x="922.5" y="443.05" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" fill="#111111">
<tspan x="922.5" dy="0">Pen</tspan>
</text>
<rect x="80" y="650" width="245" height="70" rx="8" fill="#e7f1ff" stroke="#326cb0" stroke-width="1.8"/>
<text x="202.5" y="693.05" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" fill="#111111">
<tspan x="202.5" dy="0">Browser</tspan>
</text>
<rect x="360" y="650" width="245" height="70" rx="8" fill="#ffffff" stroke="#788493" stroke-width="1.8" stroke-dasharray="8 6"/>
<text x="482.5" y="693.05" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" fill="#111111">
<tspan x="482.5" dy="0">Native app</tspan>
</text>
<rect x="800" y="650" width="245" height="70" rx="8" fill="#e7f1ff" stroke="#326cb0" stroke-width="1.8"/>
<text x="922.5" y="693.05" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" fill="#111111">
<tspan x="922.5" dy="0">Digital form</tspan>
</text>
<path d="M1080,650 H1325 V710 C1239.25,692 1165.75,728 1080,710 Z" fill="#edf7e8" stroke="#587b42" stroke-width="1.8"/>
<text x="1202.5" y="693.05" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" fill="#111111">
<tspan x="1202.5" dy="0">Paper form</tspan>
</text>
<text x="80" y="780" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#354352">
<tspan x="80" dy="0">Browser is the current client.</tspan>
<tspan x="80" dy="23.75">A native app is an independent future option.</tspan>
</text>
<text x="80" y="920" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#354352">
<tspan x="80" dy="0">Device and input choices can be combined. Physical tablet, phone and pen testing remains pending.</tspan>
</text>
<line x1="42" y1="982" x2="1398" y2="982" stroke="#d2d9e0"/>
<text x="42" y="1012" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#111111">
<tspan x="42" dy="0">Gray: logical device choice / Blue: pilot feature / Green: retained paper channel / Dashed: proposed</tspan>
</text>
<text x="42" y="1039" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" fill="#4a5664">
<tspan x="42" dy="0">SFC tenant target / Synthetic pilot / External connections remain unverified</tspan>
</text>
</svg>
