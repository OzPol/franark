<text x="62" y="222" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#111111">
<tspan x="62" dy="0">Device options</tspan>
</text>
<rect x="758" y="190" width="640" height="320" rx="10" fill="#f8fafc" stroke="#cbd5df" stroke-width="1.4"/>
<text x="778" y="222" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#111111">
<tspan x="778" dy="0">Input methods</tspan>
</text>
<rect x="42" y="550" width="640" height="300" rx="10" fill="#f8fafc" stroke="#cbd5df" stroke-width="1.4"/>
<text x="62" y="582" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#111111">
<tspan x="62" dy="0">Client software</tspan>
</text>
