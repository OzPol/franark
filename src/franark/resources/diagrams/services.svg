<text x="70" y="875" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#354352">
<tspan x="70" dy="0">Stable service IDs support a later mapping to positions, staff and access groups.</tspan>
<tspan x="70" dy="23.75">The supplied FAH and CRC labels are retained without inferred reporting relationships.</tspan>
</text>
<line x1="42" y1="982" x2="1398" y2="982" stroke="#d2d9e0"/>
