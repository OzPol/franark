name: Tests and documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and development dependencies
        run: python -m pip install -c requirements.lock -e '.[openai,dev,docs]'
      - name: Test workflow, persistence, API, and runtime contracts
        run: python -m unittest discover -s tests -v
      - name: Check generated role documentation
        run: python tools/render_roles.py --check
      - name: Build documentation
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - name: Save documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: franark-documentation
          path: docs/_build/html
          retention-days: 14
